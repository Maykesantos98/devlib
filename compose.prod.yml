services:
  devlib:
    networks: [web]

  agent:
    networks: [web]

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      devlib:
        condition: service_healthy
      agent:
        condition: service_healthy
    environment:
      DEVLIB_DOMAIN: ${DEVLIB_DOMAIN:?Defina DEVLIB_DOMAIN no arquivo .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /run:rw,noexec,nosuid,size=1m
    networks: [web]

networks:
  web:

volumes:
  caddy_data:
  caddy_config:
