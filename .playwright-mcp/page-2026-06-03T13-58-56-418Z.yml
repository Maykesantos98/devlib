      - generic [ref=e1434]: — Método
      - heading "Como usamos." [level=2] [ref=e1435]:
        - text: Como
        - emphasis [ref=e1436]: usamos.
      - paragraph [ref=e1437]: Quatro princípios que organizam o uso deste acervo no dia a dia. Pequenos hábitos, grande diferença na qualidade do que entregamos.
      - list [ref=e1438]:
        - listitem [ref=e1439]:
          - generic [ref=e1440]: "01"
          - heading "Pesquise antes de codar." [level=3] [ref=e1441]
          - paragraph [ref=e1442]: Use Context7 ou docs oficiais para confirmar APIs, versões e exemplos atuais antes de qualquer implementação.
        - listitem [ref=e1443]:
          - generic [ref=e1444]: "02"
          - heading "Verifique com docs ao vivo." [level=3] [ref=e1445]
          - paragraph [ref=e1446]: "Treine ceticismo: bibliotecas evoluem, e código baseado em versões antigas é fonte comum de bugs sutis."
        - listitem [ref=e1447]:
          - generic [ref=e1448]: "03"
          - heading "Teste como o usuário." [level=3] [ref=e1449]
          - paragraph [ref=e1450]: Use webapp-testing ou Playwright para validar o fluxo real no navegador antes de declarar pronto.
        - listitem [ref=e1451]:
          - generic [ref=e1452]: "04"
          - heading "Entregue em passos pequenos." [level=3] [ref=e1453]
          - paragraph [ref=e1454]: Commits atômicos, deploys focados, rollback fácil. A coreografia invisível que mantém o produto vivo.
