name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Install agent runtime
        run: python -m pip install -r agent/requirements.txt
      - name: Validate reverse proxy config
        run: |
          docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e DEVLIB_DOMAIN=localhost caddy:2.10.2-alpine \
            caddy validate --config /etc/caddy/Caddyfile
      - name: Start static server
        run: python -m http.server 8099 --bind 127.0.0.1 &
      - name: Validate catalog and links
        run: |
          python scripts/catalog_tool.py check
          python scripts/build_agent_api.py --check
          python scripts/check_links.py
          python tests/catalog_test.py
          python tests/catalog_intake_test.py
          python tests/production_test.py
          python tests/deployment_test.py
          python tests/agent_catalog_test.py
          python tests/rest_api_test.py
          python tests/advisor_quality_eval.py
      - name: Run user journeys
        run: |
          sleep 2
          python tests/site.spec.py
      - name: Build production image
        run: docker compose build
